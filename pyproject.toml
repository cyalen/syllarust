[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "syllarust"
requires-python = ">=3.9"
version = "0.3.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
description = "A simple library for quickly counting syllables"
dependencies = [
    "syllables==1.1.5",
]

[tool.maturin]
features = ["python", "pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
]
