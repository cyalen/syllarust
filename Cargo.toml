[package]
name = "syllarust"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
description = "A simple crate for quickly counting syllables"
repository = "https://github.com/cyalen/syllarust"
readme = "README.md"
authors = ["cyalen"]
keywords = ["syllables", "NLP", "text", "language"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "syllarust"
crate-type = ["cdylib", "rlib"]

[features]
# Enable Python bindings via PyO3. Used by maturin when building the Python wheel.
# Do not enable this for pure Rust builds (tests, benchmarks, library consumers).
python = ["dep:pyo3"]

[dependencies]
regex = "1.8.4"
pyo3 = { version = "0.25.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "syllables_bench"
harness = false
